<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Morph loop</title>
<!--
  Minimal scaffold: button → loader → check → button, with the same architecture as
  examples/reference.html (read that for every other pattern). Order of the script:
  PLAN (beat sheet) → GEO (the one shape) → driven values → camera → cursor → vis → frame(t).
-->
<style>
  @font-face { font-family: 'Geist'; src: url('Geist-Variable.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
  html, body { margin: 0; background: #ECEAE6; }
  #stage {
    position: relative; width: 1440px; height: 1440px; overflow: hidden; background: #ECEAE6;
    font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
  }
  /* The camera scales #world. Never put will-change (or translateZ hacks) on #world or anything
     inside it: the text gets rasterized once and then scaled, and turns blurry. */
  #world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
  /* The one shape. Every state is this element; only its size, radius and color change. */
  #shape { position: absolute; overflow: hidden; }
  /* #origin sits at the world origin inside the shape: lay content out in world px, and the
     shape reveals/clips it as it grows. */
  #origin { position: absolute; width: 0; height: 0; }
  #origin > * { position: absolute; }
  .t { white-space: nowrap; letter-spacing: -0.01em; }
  .num { font-variant-numeric: tabular-nums; }
  svg { display: block; overflow: visible; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="shape" data-shape>
      <div id="origin">
        <div id="btnLabel" class="t" data-name="button"><span id="btnIcon"></span><span>Download</span></div>
        <svg id="ring" width="28" height="28" viewBox="0 0 28 28" data-name="loader">
          <circle cx="14" cy="14" r="11" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="2.4"/>
          <circle id="ringArc" cx="14" cy="14" r="11" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" transform="rotate(-90 14 14)"/>
        </svg>
        <svg id="check" width="28" height="28" viewBox="0 0 24 24" data-name="check"><path id="checkPath" d="M5.5 12.5l4.3 4.3L18.5 8" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </div>
</div>

<script src="morph-kit.js"></script>
<script>
/* CONFIG — written by new_project.py from the beat analysis. */
const CONFIG = {"bpm": 120, "bars": 2, "beats": null, "accent": null, "audio": "mix.wav"};
/* END CONFIG */

const { spring, clamp, minjerk, icon } = MorphKit;
const K = MorphKit.create({ bpm: CONFIG.bpm, bars: CONFIG.bars, beats: CONFIG.beats, width: CONFIG.width, height: CONFIG.height });
const B = K.b; // beats → seconds
const INK = '#0B0B0C', PAPER = '#FFFFFF', ACC = CONFIG.accent;

// Springs: a tiny overshoot at most. Name them by feel and reuse them.
const SP = {
  morph: spring(0.55, 0.12), snap: spring(0.3, 0.1), press: spring(0.16, 0), color: spring(0.45, 0),
  cam: spring(0.95, 0),      // camera pushing in: slow, like an operator settling
  camOut: spring(0.5, 0),    // camera pulling back: as fast as the shape grows
};

// ---- 1. The beat sheet: one row per change, every change on the grid. Sounds by cue.
const PLAN = [
  [0, 'button', 'check → button (seam)'],
  [2, 'loader', 'click → loader'],
  [3, null, 'progress 60%'],
  [4, 'check', 'done → check'],
];
PLAN.forEach(([b, , label]) => K.event(b, label));
K.cue(2, 'click'); K.cue(3, 'tick', 0.4); K.cue(4, 'success', 0.8); K.cue(0, 'pop', 0.4);

// ---- 2. The one shape: size, radius, color per state (world px at real 1x UI scale).
const GEO = {
  button: { w: 204, h: 56, r: 28, bg: INK },
  loader: { w: 56, h: 56, r: 28, bg: INK },
  check:  { w: 56, h: 56, r: 28, bg: ACC || PAPER },
};
const keysFor = (prop) => PLAN.filter((p) => p[1]).map(([b, s]) => [b, GEO[s][prop]]);
const SW = K.track(keysFor('w'), SP.morph), SH = K.track(keysFor('h'), SP.morph), SR = K.track(keysFor('r'), SP.morph);
const SBG = K.colorTrack(keysFor('bg'), SP.color);
const SQUISH = K.track([[0, 0], [1.75, 1], [2, 0]], SP.press);   // press a 16th early, release on the beat
const LOAD = K.track([[0, 0.08], [2.5, 0.3], [3, 0.6], [3.75, 1]], SP.snap);

// ---- 3. Camera: each state fills the frame; zoom out fast, zoom in slow.
K.camera([
  [0, K.fit(GEO.button.w, GEO.button.h, 0.5), 0, 0, SP.camOut],   // [beat, zoom, cx, cy, spring]
  [2, K.fit(56, 56, 0.25)],
  [4, K.fit(56, 56, 0.27)],
], SP.cam);

// ---- 4. Cursor: arrive early, press a 16th before the beat, release on it, then step aside.
const BTN = [50, 12];
K.cursor([
  [0.75, BTN], [2, BTN], [2.75, [64, 56]], [7, [64, 56]],
], [[1.75, 2]]);

// ---- 5. Presence windows (enter, exit) in beats: exits are fast, enters trail slightly.
const vis = {
  btn: (t) => K.presence(t, 0, 2), ring: (t) => K.presence(t, 2, 4), check: (t) => K.presence(t, 4, 8),
};
const $ = (s) => document.querySelector(s);
const world = $('#world'), shape = $('#shape'), origin = $('#origin');
const el = Object.fromEntries(['btnLabel', 'btnIcon', 'ring', 'ringArc', 'check', 'checkPath'].map((id) => [id, document.getElementById(id)]));
el.btnIcon.innerHTML = icon('arrowDown', 18, 2, 'currentColor');
K.layer(el.btnLabel, 'center', vis.btn); K.layer(el.ring, 'center', vis.ring); K.layer(el.check, 'center', vis.check);

// ---- 6. frame(t): write every dynamic style, every frame (K.css replaces the whole inline style).
K.onFrame((t) => {
  K.css(world, { transform: K.worldTransform() });
  const w = SW(t), h = SH(t);
  K.css(shape, { ...K.box(0, 0, w, h, SR(t)), background: SBG(t), transform: `scale(${1 - 0.035 * SQUISH(t)})`,
    boxShadow: '0 0.5px 1px rgba(0,0,0,.08), 0 10px 26px -14px rgba(0,0,0,.42)' });
  K.css(origin, { left: w / 2, top: h / 2 });

  K.css(el.btnLabel, { left: -110, width: 220, top: -12, height: 24, display: 'flex', alignItems: 'center', justifyContent: 'center',
    gap: 8, fontSize: 17, fontWeight: 500, color: PAPER, ...K.swap(vis.btn(t)) });

  const C = 2 * Math.PI * 11;
  K.iconAt(el.ring, 0, 0, 28, vis.ring(t));
  K.attr(el.ringArc, 'stroke-dasharray', `${(C * clamp(LOAD(t))).toFixed(3)} ${C}`);

  // the check draws itself. K.since(t, event, appearBeat) is loop-aware: the check stays drawn
  // from beat 4 through the seam until it leaves after beat 8 (= 0 of the next loop)
  K.iconAt(el.check, 0, 0, 28, vis.check(t));
  K.attr(el.checkPath, 'stroke', ACC ? PAPER : INK);
  K.attr(el.checkPath, 'stroke-dasharray', 20);
  K.attr(el.checkPath, 'stroke-dashoffset', 20 * (1 - minjerk(clamp((K.since(t, 4, 4) - 0.04) / 0.32))));
});

K.mount($('#stage'), { audio: CONFIG.audio });
</script>
</body>
</html>
