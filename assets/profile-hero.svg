      <circle cx="64" cy="27" r="0.55" fill="#171918" opacity="0.07"/>
      <circle cx="31" cy="74" r="0.65" fill="#171918" opacity="0.06"/>
      <circle cx="84" cy="86" r="0.7" fill="#171918" opacity="0.07"/>
    </pattern>
    <clipPath id="panel">
      <rect x="0" y="0" width="1280" height="460" rx="28"/>
    </clipPath>
  </defs>

